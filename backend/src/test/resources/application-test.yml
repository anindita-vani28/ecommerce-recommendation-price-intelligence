spring:
  datasource:
    url: jdbc:h2:mem:priceintel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  flyway:
    enabled: false
  cache:
    type: none

logging:
  level:
    root: WARN

debug: false
